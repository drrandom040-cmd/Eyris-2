name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create google-services.json
      run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

    - name: Create local.properties
      run: echo "FSQ_API_KEY=${{ secrets.FSQ_API_KEY }}" > local.properties

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: List build outputs
      run: find app/build/outputs -type f || echo "No build outputs found"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/Eyris-debug.apk
